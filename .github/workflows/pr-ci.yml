name: PR CI

on:
  pull_request:
    branches: [ "main" ]

# Least-privilege token — this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs for the same PR.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test dependency updater, benchmark tools and skill checks
        run: |
          python3 -m unittest -v test_update_dependencies.py tools/test_component_benchmarks.py tools/test_skill_api.py tools/test_sync_asgard_skill.py
          python3 tools/check_skill_api.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2'

      - name: Compile (wasmJs + Android) & run unit tests
        run: >-
          ./gradlew
          :asgard:compileKotlinWasmJs
          :asgard:compileAndroidMain
          :asgard:testAndroidHostTest
          :skill-examples:compileAndroidMain
          :skill-examples:compileKotlinWasmJs
          :demo:compileKotlinWasmJs
          :demo:wasmJsBrowserDistribution
          :androidApp:assembleDebug
          :androidApp:assembleDebugAndroidTest
          :androidApp:assembleBenchmark
          :androidApp:lintDebug
          :androidApp:lintRelease
          :androidApp:lintBenchmark
          --stacktrace

      - name: Check retained JVM entry points
        run: python3 tools/check_api_compatibility.py

  android-device-tests:
    name: Android emulator interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2'
      - name: Run permanent Android app tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: androidApp/build/reports/androidTests/connected/
