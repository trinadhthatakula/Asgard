name: Deploy Demo

on:
  push:
    branches: [ "main" ]
  # Publishing creates the release tag after the main-branch gallery build has started.
  workflow_run:
    workflows: ["Publish to Maven Central"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # A delayed publication must deploy the current main branch.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2'

      - name: Build wasm production distribution
        run: ./gradlew :demo:wasmJsBrowserDistribution --no-daemon

      - name: Include the standalone glass report in the gallery
        run: cp docs/glass-ui-report.html demo/build/dist/wasmJs/productionExecutable/glass-ui-report.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/build/dist/wasmJs/productionExecutable

      - id: deployment
        uses: actions/deploy-pages@v4
