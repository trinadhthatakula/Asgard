<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="How Asgard Gallery handles Android app data, local storage, the clipboard and visits to its public web gallery.">
    <link rel="canonical" href="https://asgard.trinadhthatakula.com/privacy/">
    <link rel="icon" type="image/svg+xml" href="../bifrost.svg">
    <title>Asgard Gallery privacy policy</title>
    <style>
        :root { color-scheme: light dark; font: 100%/1.65 system-ui, sans-serif; }
        body { margin: 0; background: #f8faf3; color: #1b211c; }
        main { max-width: 43rem; margin: auto; padding: 2rem clamp(1.25rem, 5vw, 3rem) 4rem; }
        h1, h2 { line-height: 1.2; text-wrap: balance; }
        h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 2rem 0 .5rem; }
        h2 { font-size: 1.4rem; margin: 2rem 0 .5rem; }
        p { margin: .65rem 0; }
        a { color: #275e3d; text-underline-offset: .15em; overflow-wrap: anywhere; }
        nav a { display: inline-flex; align-items: center; gap: .5em; }
        code { overflow-wrap: anywhere; }
        @media (prefers-color-scheme: dark) {
            body { background: #141914; color: #e1e7dd; }
            a { color: #a5d9b1; }
        }
    </style>
</head>
<body>
<main>
    <nav aria-label="Gallery"><a href="../"><img src="../bifrost.svg" width="24" height="24" alt="">Back to Asgard Gallery</a></nav>
    ${policy}
</main>
</body>
</html>
